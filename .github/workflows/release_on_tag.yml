name: 'Release on tag'
on:
  push:
    tags:
      - '*'

jobs:
  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: ${{steps.github_release.outputs.changelog}}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  build_assets:
    needs: release
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: linux-x64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - name: Build plugin bundle
        run: PLUGIN_OUT_DIR=plugin-${{ matrix.arch }} npm run build
      - name: Create release archive
        run: |
          zip -r charts-plugin-${{ matrix.arch }}.zip plugin-${{ matrix.arch }}
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: charts-plugin-${{ matrix.arch }}.zip
          asset_name: charts-plugin-${{ matrix.arch }}.zip
          asset_content_type: application/zip